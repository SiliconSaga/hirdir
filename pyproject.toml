[project]
name = "hirdir"
version = "0.1.0"
description = "Coaching tool for MTL youth soccer — printable game sheets now, live field-time tracking later"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
hirdir = "hirdir.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "formulas>=1.2",  # evaluates workbook formulas in tests and for `hirdir build --bake`
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hirdir"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The sheets are printed and read by humans, so the typographic glyphs
# (± − × ÷ ✓ ★ “ ” —) are deliberate, not lookalike typos.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
